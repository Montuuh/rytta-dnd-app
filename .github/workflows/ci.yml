name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Runs last so a pending review never hides e2e results; PRs only warn.
      - run: npm run check:ui-review -- ${{ github.event_name == 'pull_request' && '--allow-pending' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

<!-- RYT-157: Supabase Auth "Confirm signup" template. Subject: Confirma tu cuenta de Rytta · Confirm your Rytta account -->
<div
  style="
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 480px;
    margin: 0 auto;
    color: #2a1c11;
  "
>
  <h1 style="font-size: 24px; margin: 0 0 16px">Rytta</h1>
  <p style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.5">
    Abre este enlace en el mismo dispositivo para activar tu cuenta.
  </p>
  <p style="margin: 24px 0">
    <a
      href="{{ .ConfirmationURL }}"
      style="
        font-family: Arial, sans-serif;
        background: #6e3410;
        color: #fffdf9;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
      "
      >Activar mi cuenta</a
    >
  </p>
  <p style="font-family: Arial, sans-serif; font-size: 14px; color: #664f3a; line-height: 1.5">
    Open this link on the same device to activate your account:
    <a href="{{ .ConfirmationURL }}" style="color: #6e3410">activate my account</a>.
  </p>
  <p style="font-family: Arial, sans-serif; font-size: 13px; color: #664f3a">
    Si no has creado una cuenta en Rytta, ignora este correo. If you did not create a Rytta account,
    ignore this email.
  </p>
</div>
